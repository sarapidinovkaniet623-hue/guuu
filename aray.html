<body>

    <!-- ВЕРХНЯЯ ГЛАВНАЯ КАРТОЧКА -->
    <div class="s2r3-main-card r4-bg">
        
        <!-- Левая сторона с текстом (60% ширины) -->
        <div class="s2r3-text-section">
            <!-- ИМЯ -->
            <div class="s2r3-person-name">Aray azizbekova</div>
            
            <!-- ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="s2r3-person-bio">
               Самая очаровательная малышка семьи, а также самый младший ее участник, недавно заменившая Баястана.<br>Первая правнучка семьи первого внука семьи. Впереди еще вся жизнь.
                Его характер, увлечения или памятные моменты.
            </div>
            
            <!-- Детали профиля -->
            <div class="profile-details">
                <!-- Любимый цвет -->
                <div>
                    <div class="detail-item">fav color:</div>
                    <!-- Меняйте код цвета прямо в background-color ниже -->
                    <div class="color-box" style="background-color: #00ffcc;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="s2r3-info-label">generation:</div>
                    <div class="s2r3-gen-text">Beta</div>
                </div>
            </div>

        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="s2r3-photo-section">
            <!-- ГЛАВНОЕ ФОТО (КОНТУР В КОНТУР) -->
            <img src="./img/photo_2_2026-11-01_21-56-26.jpg" alt="Главное фото" class="s2r3-main-avatar">
        </div>

    </div>

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ВОСПОМИНАНИЙ -->
    <section class="s2r3-gallery-wrapper">
        <div class="s2r3-gallery-title">Wonderfull memories</div>
        
        <div class="s2r3-gallery-row">
            <img src="./img/photo_1_2026-11-01_22-13-32.jpg" alt="Фото из прошлого 1" class="s2r3-gallery-item">
            <img src="./img/photo_2_2026-11-01_22-13-32.jpg" alt="Фото из прошлого 2" class="s2r3-gallery-item">
