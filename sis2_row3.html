<!DOCTYPE html>
<html lang="ru">
<head>
  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazar</title>
    <!-- Подключаем общий файл стилей -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- ВЕРХНЯЯ ГЛАВНАЯ КАРТОЧКА СЕСТРЫ №2 -->
    <div class="s2r3-main-card">
        
        <!-- Левая сторона с текстом (60% ширины) -->
        <div class="s2r3-text-section">
            <!-- 1. ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="s2r3-person-name">Sharapidinov Nazar</div>
            
            <!-- 2. ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="s2r3-person-bio">
                Назар — душа всей семьи.C ним не соскучешься.<br> Однако есть синдром среднего ребенка, но это не мешает ему смешить всех.
            </div>
            
            <div class="s2r3-info-grid">
                <!-- Любимый цвет -->
                <div>
                    <div class="s2r3-info-label">fav color:</div>
                    <!-- 3. В background-color ниже впишите нужный код цвета -->
                    <div class="s2r3-color-box" style="background-color: #ecfc16;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="s2r3-info-label">generation:</div>
                    <!-- 4. БУКВА ПОКОЛЕНИЯ -->
                    <div class="s2r3-gen-text">Alpha</div>
                </div>
            </div>
        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="s2r3-photo-section">
            <!-- 5. ГЛАВНОЕ ФОТО СЕСТРЫ С ОБВОДКОЙ -->
            <img src="./img/image_d31eb3d3.jpg" alt="Главное фото" class="s2r3-main-avatar">
        </div>

    </div>

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ДЕТСТВА (ВНЕ основного блока, снизу) -->
    <section class="s2r3-gallery-wrapper">
        <!-- Заголовок галереи -->
        <div class="s2r3-gallery-title">Childhood moments</div>
        
        <div class="s2r3-gallery-row">
            <!-- 6. АРХИВНЫЕ ИЛИ ДЕТСКИЕ КАРТИНКИ С ОБВОДКОЙ (5 штук в ряд) -->
            <img src="./img/photo_3_2026-10-06_00-01-09.jpg" alt="Фото из прошлого 1" class="s2r3-gallery-item">
            <img src="./img/photo_1_2026-10-06_00-01-09.jpg" alt="Фото из прошлого 2" class="s2r3-gallery-item">
            <img src="./img/з.jpg" alt="Фото из прошлого 3" class="s2r3-gallery-item">
            <img src="./img/Снимок экрана 2026-10-06 000238.png" alt="Фото из прошлого 4" class="s2r3-gallery-item">
            <img src="./img/Снимок экрана 2026-10-06 000205.png" alt="Фото из прошлого 5" class="s2r3-gallery-item">
        </div>
    </section>

</body>
</html>
