<!DOCTYPE html>
<html lang="ru">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Begimay</title>
    <!-- Подключаем общий файл стилей -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- ВЕРХНЯЯ ГЛАВНАЯ КАРТОЧКА СЕСТРЫ -->
    <div class="u-main-card">
        
        <!-- Левая сторона с текстом (60% ширины) -->
        <div class="u-text-section">
            <!-- 1. ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="u-person-name">Jumakeeva Begimay</div>
            
            <!-- 2. ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="u-person-bio">
                Гордость семьи. Первая внучка в роду, богатейший член семьи.<br>
                Выучила один из самых сложных языков в мире и благодаря этому построила карьеру.
            </div> <!-- ТЕГ УСПЕШНО ЗАКРЫТ ТУТ, ТЕПЕРЬ СТРУКТУРА НЕ СЛОМАЕТСЯ -->
            
            <div class="u-info-grid">
                <!-- Любимый цвет -->
                <div>
                    <div class="u-info-label">fav color:</div>
                    <!-- 3. Квадрат цвета -->
                    <div class="u-color-box" style="background-color: #ffa500;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="u-info-label">generation:</div>
                    <!-- 4. БУКВА ПОКОЛЕНИЯ -->
                    <div class="u-gen-text">Y</div>
                </div>
            </div>
        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="u-photo-section">
            <!-- 5. ГЛАВНОЕ ФОТО СЕСТРЫ -->
            <img src="./img/image_5e37b010.jpg" alt="Главное фото сестры" class="u-main-avatar">
        </div>

    </div>

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ДЕТСТВА -->
    <section class="u-gallery-wrapper">
        <!-- Заголовок галереи -->
        <div class="u-gallery-title">Childhood moments</div>
        
        <div class="u-gallery-row">
            <!-- 6. АРХИВНЫЕ И ДЕТСКИЕ КАРТИНКИ -->
            <img src="./img/photo_4_2026-10-05_01-11-40.jpg" alt="Детское фото 1" class="u-gallery-item">
            <img src="./img/photo_6_2026-10-05_01-11-40.jpg" alt="Детское фото 2" class="u-gallery-item">
            <img src="./img/photo_2_2026-10-05_01-11-40.jpg" alt="Детское фото 3" class="u-gallery-item">
            <img src="./img/photo_5_2026-10-05_01-11-40.jpg" alt="Детское фото 4" class="u-gallery-item">
            <img src="./img/photo_2026-11-01_18-51-26.jpg" alt="Детское фото 5" class="u-gallery-item">
        </div>
    </section>

</body>
</html>
