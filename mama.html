<!DOCTYPE html>
<html lang="ru">
<head>
 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gulmira</title>
    <!-- Подключаем новый файл стилей -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- ВЕРХНЯЯ СЕКЦИЯ: ИНФОРМАЦИЯ И ФОТО          -->
    <!-- ========================================== -->
    <div class="p-card-holder">
        
        <!-- Левый текстовый блок -->
        <div class="p-info-side">
            
            <!-- 1. ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="p-main-title">Esenalieva Gulmira</div>
            
            <!-- 2. ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="p-short-story">
                Mать первой семьи жена Нурбека и вторая по счету келинка семейства<br>самый спокойный и преданный член семьи<br>ее веселая энергетика-ее аккурат 
            </div>
            
            <div class="p-meta-box">
                <!-- Любимый цвет -->
                <div>
                    <div class="p-meta-caption">fav color:</div>
                    <!-- 3. В background-color НИЖЕ ВПИШИТЕ КОД ЦВЕТА -->
                    <div class="p-color-square" style="background-color: #979799;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="p-meta-caption">generation:</div>
                    <!-- 4. БУКВА ПОКОЛЕНИЯ -->
                    <div class="p-gen-letter">X</div>
                </div>
            </div>

        </div>

        <!-- Правый блок с главным фото (прижато вправо) -->
        <div class="p-photo-side">
            <!-- 5. ГЛАВНОЕ ФОТО (установлено на 60% ширины и авто-высоту) -->
            <img src="./img/photo_2026-11-01_23-07-59.jpg" alt="Главное фото" class="p-hero-image" style="width: 60%; height: auto;">
        </div>

    </div>


    <!-- ========================================== -->
    <!-- НИЖНЯЯ СЕКЦИЯ: ДЕТСКАЯ ГАЛЕРЕЯ             -->
    <!-- ========================================== -->
    <section class="p-gallery-block">
        
        <!-- Заголовок галереи -->
        <div class="p-gallery-heading">Nastolgia</div>
        
        <div class="p-gallery-flex">
            <!-- 6. ДЕТСКИЕ КАРТИНКИ -->
            <img src="./img/IMG-20170304-WA0028 (1).jpg" alt="Детское фото 1" class="p-gallery-pic">
            <img src="./img/IMG-20170304-WA0045.jpg" alt="Детское фото 2" class="p-gallery-pic">
            <img src="./img/IMG-20170603-WA0028 (1).jpg" alt="Детское фото 3" class="p-gallery-pic">
            <img src="./img/20170727_144158 (1).jpg" alt="Детское фото 4" class="p-gallery-pic">
            <img src="./img/20171022_114014 (1).jpg" alt="Детское фото 5" class="p-gallery-pic">
        </div>

    </section>

</body>
</html>
