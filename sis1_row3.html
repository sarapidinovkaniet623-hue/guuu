<!DOCTYPE html>
<html lang="ru">
<head>
  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alisher</title>
    <!-- Подключаем общий файл стилей -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- ВЕРХНЯЯ ГЛАВНАЯ КАРТОЧКА СЕСТРЫ -->
    <div class="s1r3-main-card">
        
        <!-- Левая сторона с текстом (60% ширины) -->
        <div class="s1r3-text-section">
            <!-- 1. ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="s1r3-person-name">Sharapidinov Alisher</div>
            
            <!-- 2. ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="s1r3-person-bio">
               Алишер — главная звезда всей семьи. Где он только не побывал. О его рисунках знает каждый. <br> Терпение и труд всё перетрут — его точное описание. Хотите почилить? Идите к нему.
            </div>
            
            <div class="s1r3-info-grid">
                <!-- Любимый цвет -->
                <div>
                    <div class="s1r3-info-label">fav color:</div>
                    <!-- 3. В background-color ниже впишите нужный код цвета -->
                    <div class="s1r3-color-box" style="background-color: #ff0000;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="s1r3-info-label">generation:</div>
                    <!-- 4. БУКВА ПОКОЛЕНИЯ (например, Z или Альфа) -->
                    <div class="s1r3-gen-text">Z</div>
                </div>
            </div>
        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="s1r3-photo-section">
            <!-- 5. ГЛАВНОЕ ФОТО СЕСТРЫ С ОБВОДКОЙ -->
            <img src="./img/photo_3_2026-10-05_23-39-35.jpg" alt="Главное foto" class="s1r3-main-avatar">
        </div>

    </div>

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ДЕТСТВА (ВНЕ основного блока, снизу) -->
    <section class="s1r3-gallery-wrapper">
        <!-- Заголовок галереи -->
        <div class="s1r3-gallery-title">Childhood moments</div>
        
        <div class="s1r3-gallery-row">
            <!-- 6. АРХИВНЫЕ ИЛИ ДЕТСКИЕ КАРТИНКИ С ОБВОДКОЙ (5 штук в ряд) -->
            <img src="./img/photo_7_2026-10-05_23-39-35.jpg" alt="Фото из прошлого 1" class="s1r3-gallery-item">
            <img src="./img/photo_1_2026-10-05_23-39-35.jpg" alt="Фото из прошлого 2" class="s1r3-gallery-item">
            <img src="./img/photo_5_2026-10-05_23-39-35.jpg" alt="Фото из прошлого 3" class="s1r3-gallery-item">
            <img src="./img/photo_6_2026-10-05_23-39-35.jpg" alt="Фото из прошлого 4" class="s1r3-gallery-item">
            <img src="./img/Снимок экрана 2026-10-05 234334.png" alt="Фото из прошлого 5" class="s1r3-gallery-item">
        </div>
    </section>

</body>
</html>
