<!DOCTYPE html>
<html lang="ru">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolotbek</title>
    <!-- Подключаем твой общий файл стилей -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- ВЕРХНЯЯ ГЛАВНАЯ КАРТОЧКА СЕСТРЫ 1 (РЯД 2) -->
    <div class="s1-2-main-card">
        
        <!-- Левая сторона с текстом (60% ширины) -->
        <div class="s1-2-text-section">
            <!-- 1. ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="s1-2-person-name">Jumakeev Bolotbek</div>
            
            <!-- 2. ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="s1-2-person-bio">
             Нужно что-то объяснять? Легендарнее человека не найти. Первый внук, первопроходец третьего поколения. <br> Любимый наследник и первый отец из поколения внуков .Недавно ставший отцом очаровательной дочки.
            </div>
            
            <div class="s1-2-info-grid">
                <!-- Любимый цвет -->
                <div>
                    <div class="s1-2-info-label">fav color:</div>
                    <!-- 3. В background-color НИЖЕ ВПИШИТЕ КОД ЦВЕТА -->
                    <div class="s1-2-color-box" style="background-color: #8a9908;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="s1-2-info-label">generation:</div>
                    <!-- 4. БУКВА ПОКОЛЕНИЯ -->
                    <div class="s1-2-gen-text">Y</div>
                </div>
            </div>
        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="s1-2-photo-section">
            <!-- 5. ГЛАВНОЕ ФОТО СЕСТРЫ (взято из твоей разметки 2-го ряда) -->
            <img src="./img/photo_2026-10-05_00-29-45.jpg" alt="Главное фото сестры" class="s1-2-main-avatar">
        </div>

    </div>

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ДЕТСТВА -->
    <section class="s1-2-gallery-wrapper">
        <!-- Заголовок галереи -->
        <div class="s1-2-gallery-title">Childhood moments</div>
        
        <div class="m-gallery-row">
            <!-- 6. АРХИВНЫЕ И ДЕТСКИЕ КАРТИНКИ -->
            <img src="./img/photo_4_2026-10-05_00-38-39.jpg" alt="Детское фото 1" class="s1-2-gallery-item">
            <img src="./img/photo_1_2026-10-05_00-38-39.jpg" alt="Детское фото 2" class="s1-2-gallery-item">
            <img src="./img/image_1a85ab99.jpg" alt="Детское фото 3" class="s1-2-gallery-item">
            <img src="./img/photo_5_2026-10-05_00-38-39.jpg" alt="Детское фото 4" class="s1-2-gallery-item">
            <img src="./img/photo_2_2026-10-05_00-38-39.jpg" alt="Детское фото 5" class="s1-2-gallery-item">
        </div>
    </section>

</body>
</html>
