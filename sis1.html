<!DOCTYPE html>
<html lang="ru">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bermet</title>
    <!-- Подключаем внешний файл стилей CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- ВЕРХНИЙ БЛОК: ИНФОРМАЦИЯ И ГЛАВНОЕ ФОТО    -->
    <!-- ========================================== -->
    <div class="fam-hero-block">
        
        <!-- Левая часть: Имя, описание и фишки -->
        <div class="fam-text-container">
            
            <!-- 1. СЮДА ПИСАТЬ ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="fam-member-name">Jumakeeva Bermet</div>
            
            <!-- 2. СЮДА ПИСАТЬ ОПИСАНИЕ ИЛИ КРАТКУЮ БИОГРАФИЮ -->
            <div class="fam-member-bio">
                Бермет-эталон целюустремленности и решимости,первый ребенок Нурбека <br> и одна из первых внуков,если вам надо разузнать <br> насчет IT ил физике-это к ней
            </div>
            
            <div class="fam-stats-row">
                <!-- Любимый цвет -->
                <div>
                    <div class="fam-stat-label">fav color:</div>
                    <!-- 3. В background-color НИЖЕ ВПИШИТЕ КОД ЦВЕТА -->
                    <div class="fam-color-indicator" style="background-color: #4106cc;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="fam-stat-label">generation:</div>
                    <!-- 4. СЮДА ПИСАТЬ БУКВУ ПОКОЛЕНИЯ (Z, Y, X и т.д.) -->
                    <div class="fam-gen-badge">Z</div>
                </div>
            </div>

        </div>

        <!-- Правая часть: Главная большая фотография -->
        <div class="fam-main-photo-wrap">
            <!-- 5. СЮДА ВСТАВИТЬ НАЗВАНИЕ ГЛАВНОГО ФОТО (вместо main-photo.jpg) -->
            <img src="./img/image_ccd6bef.jpg" alt="Главное фото" class="fam-main-photo-img">
        </div>

    </div>


    <!-- ========================================== -->
    <!-- НИЖНИЙ БЛОК: ДЕТСКИЕ ФОТОГРАФИИ (ГАЛЕРЕЯ)  -->
    <!-- ========================================== -->
    <section class="fam-childhood-section">
        
        <!-- Заголовок галереи -->
        <div class="fam-childhood-title">Childhood moments</div>
        
        <div class="fam-childhood-grid">
            <!-- 6. СЮДА ВСТАВЛЯЙТЕ НАЗВАНИЯ ДЕТСКИХ КАРТИНОК -->
            <img src="./img/фото Бермет 052.jpg" alt="Детское фото 1" class="fam-childhood-thumb">
            <img src="./img/фото Бермет 051.jpg" alt="Детское фото 2" class="fam-childhood-thumb">
            <img src="./img/фото Бермет 012.jpg" alt="Детское фото 3" class="fam-childhood-thumb">
            <img src="./img/фото Бермет 018.jpg" alt="Детское фото 4" class="fam-childhood-thumb">
            <img src="./img/фото Бермет 019.jpg" alt="Детское фото 5" class="fam-childhood-thumb">
        </div>

    </section>

</body>
</html>
