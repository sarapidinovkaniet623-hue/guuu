<!DOCTYPE html>
<html lang="ru">
<head>
 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuk</title>
    <!-- Подключаем тот же файл стилей -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- ВЕРХНЯЯ ГЛАВНАЯ КАРТОЧКА ОТЦА -->
    <div class="f-main-card">
        
        <!-- Левая сторона с текстом (60% ширины) -->
        <div class="f-text-section">
            <!-- 1. ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="f-person-name">Jumakeev Azizbek</div>
            
            <!-- 2. ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="f-person-bio">
              Aзиз или же позывной Ажук закперил за собой ассоциацию<br> с угрозой ведь вседа при непослушании детей запугивали этим именем<br> Физически сильнейший член семьи
            </div>
            
            <div class="f-info-grid">
                <!-- Любимый цвет -->
                <div>
                    <div class="f-info-label">fav color:</div>
                    <!-- 3. В background-color НИЖЕ ВПИШИТЕ КОД ЦВЕТА (сейчас стоит тёмно-синий) -->
                    <div class="f-color-box" style="background-color: #62676e;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="f-info-label">generation:</div>
                    <!-- 4. БУКВА ПОКОЛЕНИЯ -->
                    <div class="f-gen-text">X</div>
                </div>
            </div>
        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="f-photo-section">
            <!-- 5. ГЛАВНОЕ ФОТО ОТЦА -->
            <img src="./img/image_89556f5c.jpg" alt="Главное фото" class="f-main-avatar">
        </div>

    </div>

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ДЕТСТВА/МОЛОДОСТИ -->
    <section class="f-gallery-wrapper">
        <!-- Заголовок галереи -->
        <div class="f-gallery-title">Nostalgia</div>
        
        <div class="f-gallery-row">
            <!-- 6. ДЕТСКИЕ / АРХИВНЫЕ КАРТИНКИ -->
            <img src="./img/image_eebebfd6.jpg" alt="Фото из прошлого 1" class="f-gallery-item">
        </div>
    </section>

</body>
</html>
