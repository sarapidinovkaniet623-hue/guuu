            <!-- 1. ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="u-person-name">Jumakeeva Azaliya</div>
            
            <!-- 2. ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="u-person-bio">
                Зарождающаяся звезда. Один из самых младших членов семьи и одно из самых очаровательных созданий в мире.<br>Ее танцы обвороживают глаза, а игра на комузе вызывает мурашки по коже.
               
            </div>
            
            <div class="u-info-grid">
                <!-- Любимый цвет -->
                <div>
                    <div class="u-info-label">fav color:</div>

                    <div class="u-color-box" style="background-color: #e100ff;"></div>
                </div>

                    <!-- 4. БУКВА ПОКОЛЕНИЯ -->
                    <div class="u-gen-text">Alpha</div>
                </div>
            </div>

            <!-- 5. ГЛАВНОЕ ФОТО СЫНА (автоматически подхватит картинку из твоей разметки 2-го ряда) -->
            <img src="./img/photo_2026-10-05_01-28-16.jpg" alt="Главное фото сына" class="u-main-avatar">
        </div>

    </div>

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ДЕТСТВА -->
    <section class="u-gallery-wrapper">
        <!-- Заголовок галереи -->
        <div class="u-gallery-title">Childhood moments</div>
        
        <div class="u-gallery-row">
            <!-- 6. АРХИВНЫЕ И ДЕТСКИЕ КАРТИНКИ СЫНА -->

            <img src="./img/Снимок экрана 2026-10-05 012634.png" alt="Детское фото 5" class="u-gallery-item">
