<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ismailova Aida</title>
    <!-- Подключаем файл стилей -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- ВЕРХНЯЯ ГЛАВНАЯ КАРТОЧКА МАМЫ №3 -->
    <div class="m3-main-card">
        
        <!-- Левая сторона с текстом (60% ширины) -->
        <div class="m3-text-section">
            <!-- 1. ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="m3-person-name">Ismailova Aida</div>
            
            <!-- 2. ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="m3-person-bio">
                Аида — главная келинка в семье.<br> 
                Не оставит тебя голодным. Является женой наследника семьи.
            </div>
            
            <div class="m3-info-grid">
                <!-- Любимый цвет -->
                <div>
                    <div class="m3-info-label">fav color:</div>
                    <div class="m3-color-box" style="background-color: #e8a7a1;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="m3-info-label">generation:</div>
                    <div class="m3-gen-text">X</div>
                </div>
            </div>
        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="m3-photo-section">
            <!-- 5. ГЛАВНОЕ ФОТО МАМЫ №3 -->
            <img src="./img/p.jpe" alt="Главное фото" class="m3-main-avatar">
        </div>

    </div>

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ДЕТСТВА (ВНЕ розового блока, снизу) -->
    <section class="m3-gallery-wrapper">
        <!-- Заголовок галереи -->
        <div class="m3-gallery-title">Nostalgia</div>
        
        <div class="m3-gallery-row">
            <!-- 6. АРХИВНЫЕ ИЛИ ДЕТСКИЕ КАРТИНКИ -->
            <img class="hope" src=" ./img/image_eebebfd6.jpg" alt="Фото из прошлого 1" class="m3-gallery-item">
        </div>
    </section>

</body>
</html>
