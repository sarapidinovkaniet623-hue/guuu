<!DOCTYPE html>
<html lang="ru">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurjamal</title>
    <!-- Я ПОДКЛЮЧИЛ ТУТ СТИЛИ, ВСЁ БУДЕТ РАБОТАТЬ! -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ГЛАВНЫЙ БЛОК ПРОФИЛЯ ТЁТИ -->
    <div class="fam-member3-container">
        
        <!-- Левая текстовая сторона (60% ширины) -->
        <div class="fam-member3-text-zone">
            
            <!-- Имя -->
            <div class="fam-member3-name">Nurjamal Jumakeeva</div>
            
            <!-- Описание / Биография -->
            <div class="fam-member3-bio">
               Самый старший член семьи и поколения X, <br>первый ребенок в семье и любимая тетя всей семьи.
            </div>
            
            <!-- Блок характеристик -->
            <div class="fam-member3-stats-row">
                <!-- Любимый цвет -->
                <div>
                    <div class="fam-member3-label">fav color:</div>
                    <!-- Меняй код цвета в background-color ниже -->
                    <div class="fam-member3-color-box" style="background-color: #e64922;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="fam-member3-label">generation:</div>
                    <div class="fam-member3-gen-text">X</div>
                </div>
            </div>

        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="fam-member3-photo-zone">
            <!-- Твоё главное фото кубика №3 из папки img -->
            <img src="./img/photo_2026-11-01_21-05-17.jpg" alt="Главное фото Тёти" class="fam-member3-main-img">
        </div>

    </div>

    <!-- СЕКЦИЯ С АРХИВНЫМИ ФОТОГРАФИЯМИ СТРОГО В ОДИН РЯД -->
    <section class="fam-member3-gallery-section">
        
        <!-- Заголовок галереи -->
        <div class="fam-member3-gallery-title">Early family moments</div>
        
        <div class="fam-member3-gallery-grid">
            <!-- Вставь сюда пути к архивным фотографиям тёти -->
            <img src="./img/photo_1_2026-11-01_21-07-44.jpg" alt="Архив 1" class="fam-member3-gallery-item">
            <img src="./img/photo_1_2026-11-01_20-41-52.jpg" alt="Архив 2" class="fam-member3-gallery-item">
        </div>

    </section>

</body>
</html>
