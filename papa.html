<!DOCTYPE html>
<html lang="ru">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurbek</title>
    <!-- Подключаем новый файл стилей -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- ВЕРХНЯЯ ГЛАВНАЯ КАРТОЧКА -->
    <div class="u-main-card">
        
        <!-- Левая сторона с текстом (60% ширины) -->
        <div class="u-text-section">
            <!-- 1. ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="u-person-name">Jumakeev Nurber</div>
            
            <!-- 2. ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="u-person-bio">
              Сторший сын бабушки и глава первого семейства<br> золотые руки,стальной характер-его описание в двух словах
            </div>
            
            <div class="u-info-grid">
                <!-- Любимый цвет -->
                <div>
                    <div class="u-info-label">fav color:</div>
                    <!-- 3. В background-color НИЖЕ ВПИШИТЕ КОД ЦВЕТА -->
                    <div class="u-color-box" style="background-color: #c58700;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="u-info-label">generation:</div>
                    <!-- 4. БУКВА ПОКОЛЕНИЯ -->
                    <div class="u-gen-text">X</div>
                </div>
            </div>
        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="u-photo-section">
            <!-- 5. ГЛАВНОЕ ФОТО (Ширина 60% от блока, высота авто, линия прижата слева) -->
            <img src="./img/photo_2026-09-18_00-12-07.jpg" alt="Главное фото" class="u-main-avatar">
        </div>

    </div>

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ДЕТСТВА -->
    <section class="u-gallery-wrapper">
        <!-- Заголовок галереи -->
        <div class="u-gallery-title">Nastolgia</div>
        
        <div class="u-gallery-row">
            <!-- 6. ДЕТСКИЕ КАРТИНКИ -->
            <img src="./img/20160814_155200.jpg" alt="Детское фото 1" class="u-gallery-item">
            <img src="./img/IMG_1407.jpg" alt="Детское фото 2" class="u-gallery-item">
            <img src="./img/фото Нурбек 054.jpg" alt="Детское фото 3" class="u-gallery-item">
            <img src="./img/20170423_193413.jpg" alt="Детское фото 4" class="u-gallery-item">
            <img src="./img/Снимок экрана 2026-10-05 014256.png" alt="Детское фото 5" class="u-gallery-item">
        </div>
    </section>

</body>
</html>
