<!DOCTYPE html>
<html lang="ru">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ulan</title>
    <!-- Подключаем тот же файл стилей -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- ВЕРХНЯЯ ГЛАВНАЯ КАРТОЧКА ОТЦА №3 -->
    <div class="f3-main-card">
        
        <!-- Левая сторона с текстом (60% ширины) -->
        <div class="f3-text-section">
            <!-- 1. ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="f3-person-name">Jumakeev Ulan</div>
            
            <!-- 2. ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="f3-person-bio">
                 Младший сын и наследник своего дома. Директор,могучий отец и хороший муж
            </div>
            
            <div class="f3-info-grid">
                <!-- Любимый цвет -->
                <div>
                    <div class="f3-info-label">fav color:</div>
                    <!-- 3. В background-color НИЖЕ ВПИШИТЕ КОД ЦВЕТА -->
                    <div class="f3-color-box" style="background-color: #2c3e50;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="f3-info-label">generation:</div>
                    <!-- 4. БУКВА ПОКОЛЕНИЯ -->
                    <div class="f3-gen-text">X</div>
                </div>
            </div>
        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="f3-photo-section">
            <!-- 5. ГЛАВНОЕ ФОТО ОТЦА №3 -->
            <img src="./img/photo_2_2026-10-05_23-00-05.jpg" alt="Главное фото" class="f3-main-avatar">
        </div>

    </div>

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ДЕТСТВА/МОЛОДОСТИ -->
    <section class="f3-gallery-wrapper">
        <!-- Заголовок галереи -->
        <div class="f3-gallery-title">Nostalgia</div>
        
        <div class="f3-gallery-row">
            <!-- 6. ДЕТСКИЕ / АРХИВНЫЕ КАРТИНКИ -->
            <img src="./img/photo_1_2026-11-01_22-43-04.jpg" alt="Фото из прошлого 1" class="f3-gallery-item">
            <img src="./img/photo_2_2026-11-01_22-43-04.jpg" alt="Фото из прошлого 2" class="f3-gallery-item">
        </div>
    </section>

</body>
</html>
