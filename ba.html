<!DOCTYPE html>
<html lang="ru">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roza</title>
    <!-- ЭТА СТРОКА СВЯЗЫВАЕТ HTML С CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ГЛАВНЫЙ БЛОК ПРОФИЛЯ БАБУШКИ -->
    <div class="fam-member2-container">
        
        <!-- Левая текстовая сторона (60% ширины) -->
        <div class="fam-member2-text-zone">
            
            <!-- Имя -->
            <div class="fam-member2-name">Roza Toktokojoeva</div>
            
            <!-- Описание / Биография -->
            <div class="fam-member2-bio">
                Всеми любимая наша бабушка.Самый уважаемый и самый старший член семьи<br>на данный момент. Главное звено, объединяющее всю семью воедино.
            </div>
            
            <!-- Блок характеристик -->
            <div class="fam-member2-stats-row">
                <!-- Любимый цвет -->
                <div>
                    <div class="fam-member2-label">fav color:</div>
                    <!-- Меняй код цвета в background-color ниже -->
                    <div class="fam-member2-color-box" style="background-color: #f1fc59;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="fam-member2-label">generation:</div>
                    <div class="fam-member2-gen-text">The silent generation</div>
                </div>
            </div>

        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="fam-member2-photo-zone">
            <!-- Твоё главное фото кубика №2 из папки img -->
            <img src="./photo 1_2026-11-01_22-17-48.jpg" alt="Главное фото Бабушки" class="fam-member2-main-img">
        </div>

    </div>

    <!-- СЕКЦИЯ С ДЕТСКИМИ ФОТОГРАФИЯМИ -->
    <section class="fam-member2-gallery-section">
        
        <!-- Заголовок галереи -->
        <div class="fam-member2-gallery-title">Early family moments</div>
        
        <div class="fam-member2-gallery-grid">
            <!-- Вставь сюда пути к двум архивным фотографиям бабушки -->
            <img src="./img/photo_4_2026-11-01_20-41-52.jpg" alt="Архив 1" class="fam-member2-gallery-item">
            <img src="./img/photo_1_2026-11-01_20-41-52.jpg" alt="Архив 2" class="fam-member2-gallery-item">
            <img src="./img/photo_1 2026-11-01_20-52-07.jpg" alt="Архив 2" class="fam-member2-gallery-item">
             <img src="./img/photo_5_2026-11-01_20-41-52.jpg" alt="Архив 2" class="fam-member2-gallery-item">
            <img src="./img/photo_3_2026-11-01_20-41-52.jpg" alt="Архив 2" class="fam-member2-gallery-item">

    </section>

</body>
</html>
