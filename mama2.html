<!DOCTYPE html>
<html lang="ru">
<head>
 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elmira</title>
    <!-- Подключаем твой общий файл стилей -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- ВЕРХНЯЯ ГЛАВНАЯ КАРТОЧКА МАМЫ -->
    <div class="m-main-card">
        
        <!-- Левая сторона с текстом (60% ширины) -->
        <div class="m-text-section">
            <!-- 1. ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="m-person-name">Jumakeeva Elmira</div>
            
            <!-- 2. ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="m-person-bio">
              Хранительница очага и самая чистоплотная в семье<br> от Ташкента до Ашхабада!
            </div>
            
            <div class="m-info-grid">
                <!-- Любимый цвет -->
                <div>
                    <div class="m-info-label">fav color:</div>
                    <!-- 3. В background-color НИЖЕ ВПИШИТЕ КОД ЦВЕТА -->
                    <div class="m-color-box" style="background-color: #ff69b4;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="m-info-label">generation:</div>
                    <!-- 4. БУКВА ПОКОЛЕНИЯ -->
                    <div class="m-gen-text">X</div>
                </div>
            </div>
        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="m-photo-section">
            <!-- 5. ГЛАВНОЕ ФОТО МАМЫ (линия прижата слева) -->
            <img src="./img/image_8610eac3.jpg" alt="Главное фото мамы" class="m-main-avatar">
        </div>

    </div>

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ДЕТСТВА/МОЛОДОСТИ -->
    <section class="m-gallery-wrapper">
        <!-- Заголовок галереи -->
        <div class="m-gallery-title">Nastolgia</div>
        
        <div class="m-gallery-row">
            <!-- 6. АРХИВНЫЕ И ДЕТСКИЕ КАРТИНКИ -->
            <img src="./img/image_eebebfd6.jpg" alt="Детское фото 1" class="m-gallery-item">
 
        </div>
    </section>

</body>
</html>
