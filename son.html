<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaniet</title>
    <!-- Подключаем твой общий файл стилей -->
   <link rel="stylesheet" href="./style.css?v=2">

</head>
<body>

    <!-- ВЕРХНЯЯ ГЛАВНАЯ КАРТОЧКА КАНИЕТА -->
    <div class="u-main-card">
        
        <!-- Левая сторона с текстом (60% ширины) -->
        <div class="u-text-section">
            <!-- 1. ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="u-person-name">Kaniet Sharapidinov</div>
            
            <!-- 2. ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="u-person-bio">
                Каниет — сын Нурбека, 7 внук и наследник своего отца, один из самых младших в семейном древе и входит в поколение Z (зумеры).<br>
                Характер: неусидчивый, в постоянном движении.
            </div>
            
            <div class="u-info-grid">
                <!-- Любимый цвет -->
                <div>
                    <div class="u-info-label">fav color:</div>
                    <!-- 3. Темно-синий квадрат цвета (вместо тяжелой картинки) -->
                    <div class="u-color-box" style="background-color: #0033aa;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="u-info-label">generation:</div>
                    <!-- 4. БУКВА ПОКОЛЕНИЯ -->
                    <div class="u-gen-text">Z</div>
                </div>
            </div>
        </div>

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="u-photo-section">
            <!-- 5. ГЛАВНОЕ ФОТО КАНИЕТА (линия прижата слева) -->
            <img src="./img/photo_1_2026-08-22_22-07-58.jpg" alt="Kaniet" class="u-main-avatar">
        </div>

    </div>

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ДЕТСТВА -->
    <section class="u-gallery-wrapper">
        <!-- Заголовок галереи -->
        <div class="u-gallery-title">Childhood moments</div>
        
        <div class="u-gallery-row">
            <!-- 6. ДЕТСКИЕ КАРТИНКИ КАНИЕТА (Всего 6 штук) -->
            <img src="./img/SAM_0158.JPG" alt="Детское фото 1" class="u-gallery-item">
            <img src="./img/SAM_0219.JPG" alt="Детское фото 2" class="u-gallery-item">
            <img src="./img/SAM_0695.JPG" alt="Детское фото 3" class="u-gallery-item">
            <img src="./img/фото Бермет 021.jpg" alt="Детское фото 4" class="u-gallery-item">
            <img src="./img/фото Бермет 026.jpg" alt="Детское фото 5" class="u-gallery-item">
            <img src="./img/20160813_143940.jpg" alt="Детское фото 6" class="u-gallery-item">
        </div>
    </section>

</body>
</html>
