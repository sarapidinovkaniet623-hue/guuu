<!DOCTYPE html>
<html lang="ru">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aliya</title>
    <!-- Подключаем внешний файл стилей CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- ВЕРХНИЙ БЛОК: ИНФОРМАЦИЯ И ГЛАВНОЕ ФОТО    -->
    <!-- ========================================== -->
    <div class="profile-card">
        
        <!-- Левая часть: Имя, описание и фишки -->
        <div class="profile-info">
            
            <!-- 1. СЮДА ПИСАТЬ ИМЯ ЧЛЕНА СЕМЬИ -->
            <div class="profile-name">Jumakeeva Aliya</div>
            
            <!-- 2. СЮДА ПИСАТЬ ОПИСАНИЕ ИЛИ КРАТКУЮ БИОГРАФИЮ -->
            <div class="profile-description">
               Алия-милота семьи, второй ребенок Нурбека,учиться в СФУ<br>один из самых маленьких членов семьи но <br> самая шустрая ее визитная карточка-ее доброта
            </div>
            
            <div class="profile-details">
                <!-- Любимый цвет -->
                <div>
                    <div class="detail-item">fav color:</div>
                    <!-- 3. В background-color НИЖЕ ВПИШИТЕ КОД ЦВЕТА (например: #ff0000 для красного, #00ff00 для зеленого) -->
                    <div class="color-box" style="background-color: #ff00ff;"></div>
                </div>
                
                <!-- Поколение -->
                <div>
                    <div class="detail-item">generation:</div>
                    <!-- 4. СЮДА ПИСАТЬ БУКВУ ПОКОЛЕНИЯ (Z, Y, X и т.д.) -->
                    <div class="gen-letter">Z</div>
                </div>
            </div>

        </div>

        <!-- Правая часть: Главная большая фотография -->
        <div class="profile-photo-container">
            <!-- 5. СЮДА ВСТАВИТЬ НАЗВАНИЕ ГЛАВНОГО ФОТО (вместо main-photo.jpg) -->
            <img src="./img/image_2ae9516d.jpg" alt="Главное фото" class="profile-photo">
        </div>

    </div>


    <!-- ========================================== -->
    <!-- НИЖНИЙ БЛОК: ДЕТСКИЕ ФОТОГРАФИИ (ГАЛЕРЕЯ)  -->
    <!-- ========================================== -->
    <section class="gallery-section">
        
        <!-- Заголовок галереи -->
        <div class="gallery-title">Childhood moments</div>
        
        <div class="gallery-grid">
            <!-- 6. СЮДА ВСТАВЛЯЙТЕ НАЗВАНИЯ ДЕТСКИХ КАРТИНОК (вместо child1.jpg, child2.jpg и т.д.) -->
            <!-- Вы можете удалять строки или дописывать новые такие же строчки <img> -->
            <img src="./img/фото Нурбек 066.jpg" alt="Детское фото 1" class="gallery-item">
            <img src="./img/photo_1_2026-11-01_18-58-08.jpg" alt="Детское фото 2" class="gallery-item">
            <img src="./img/photo_2_2026-11-01_18-58-08.jpg" alt="Детское фото 3" class="gallery-item">
            <img src="./img/IMG_20220104_212134.jpg" alt="Детское фото 4" class="gallery-item">
            <img src="./img/фото Бермет 040.jpg" alt="Детское фото 5" class="gallery-item">
        </div>

    </section>

</body>
</html>
