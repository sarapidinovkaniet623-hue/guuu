<!DOCTYPE html>
<html lang="ru">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunduz</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- ВЕРХНЯЯ ГЛАВНАЯ КАРТОЧКА -->
    <div class="s2r3-main-card r4-bg">
        
        <!-- Левая сторона с текстом (60% ширины) -->
        <div class="s2r3-text-section">
            <!-- ИМЯ -->
            <div class="s2r3-person-name">Kunduz</div>
            
            <!-- ОПИСАНИЕ ИЛИ КРАТКАЯ БИОГРАФИЯ -->
            <div class="s2r3-person-bio">
                Кундуз — жена первого внука и первая келинка нового поколения. Один из молодых самых <br>нового поколения. Один из молодых самых членов семьи. Присоединилась в семью относительно недавно.
            </div>
            
            <!-- Детали профиля -->
            <div class="profile-details">
                <!-- Любимый цвет -->
                <div>
                    <div class="detail-item">fav color:</div>
                    <div class="color-box" style="background-color: #ffc0ff;"></div>
                </div>
                
                <!-- Поколение (ИСПРАВЛЕНО ТУТ) -->
                <div>
                    <div class="s2r3-info-label">generation:</div>
                    <div class="s2r3-gen-text">Y</div>
                </div>
            </div> <!-- profile-details закрыт -->

        </div> <!-- s2r3-text-section закрыт -->

        <!-- Правая сторона для фото (40% ширины) -->
        <div class="s2r3-photo-section">
            <!-- ГЛАВНОЕ ФОТО (КОНТУР В КОНТУР) -->
            <img src="./img/photo_1_2026-11-01_21-56-26.jpg" alt="Главное фото" class="s2r3-main-avatar">
        </div>

    </div> <!-- s2r3-main-card закрыт -->

    <!-- НИЖНЯЯ ГАЛЕРЕЯ ДЕТСТВА -->
    <section class="s2r3-gallery-wrapper">
        <div class="s2r3-gallery-title">Wonderfull memories</div>
        
        <div class="s2r3-gallery-row">
            <img src="./img/photo_1_2026-11-01_21-57-45.jpg" alt="Фото из прошлого 1" class="s2r3-gallery-item">
            <img src="./img/photo_2_2026-11-01_21-57-45.jpg" alt="Фото из прошлого 2" class="s2r3-gallery-item">
            <img src="./img/photo_3_2026-11-01_21-57-45.jpg" alt="Фото из прошлого 3" class="s2r3-gallery-item">
            <img src="./img/photo_4_2026-11-01_21-57-45.jpg" alt="Фото из прошлого 4" class="s2r3-gallery-item">
            <img src="./img/photo_5_2026-11-01_21-57-45.jpg" alt="Фото из прошлого 5" class="s2r3-gallery-item">
        </div>
    </section>

</body>
</html>
